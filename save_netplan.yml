---
- name: netplans
  hosts: routers
  gather_facts: no
  tasks:

    - name: inetRouter routes
      ansible.builtin.copy:
        dest: /etc/netplan/60-routing-fix.yaml
        owner: root
        group: root
        mode: '0640'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              enp0s3:
                dhcp4: true
                dhcp6: false
              enp0s8:
                addresses:
                  - 192.168.255.1/30
                routes:
                  - to: 192.168.0.0/16
                    via: 192.168.255.2
      when: inventory_hostname == 'inetRouter'

    - name: centralRouter routes
      ansible.builtin.copy:
        dest: /etc/netplan/60-routing-fix.yaml
        owner: root
        group: root
        mode: '0640'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              enp0s8:
                addresses:
                  - 192.168.255.2/30
                routes:
                  - to: default
                    via: 192.168.255.1
              enp0s17:
                addresses:
                  - 192.168.255.9/30
                routes:
                  - to: 192.168.2.0/24
                    via: 192.168.255.10
              enp0s18:
                addresses:
                  - 192.168.255.5/30
                routes:
                  - to: 192.168.1.0/24
                    via: 192.168.255.6
      when: inventory_hostname == 'centralRouter'

    - name: office1Router routes
      ansible.builtin.copy:
        dest: /etc/netplan/60-routing-fix.yaml
        owner: root
        group: root
        mode: '0640'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              enp0s8:
                addresses:
                  - 192.168.255.10/30
                routes:
                  - to: default
                    via: 192.168.255.9
      when: inventory_hostname == 'office1Router'

    - name: office2Router routes
      ansible.builtin.copy:
        dest: /etc/netplan/60-routing-fix.yaml
        owner: root
        group: root
        mode: '0640'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              enp0s8:
                addresses:
                  - 192.168.255.6/30
                routes:
                  - to: default
                    via: 192.168.255.5
      when: inventory_hostname == 'office2Router'

    - name: del Vagrant netplan
      ansible.builtin.file:
        path: /etc/netplan/50-vagrant.yaml
        state: absent
      when: inventory_hostname != 'inetRouter'

    - name: restart network
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted

    - name: netplan apply
      ansible.builtin.shell: |
        netplan apply || true

    - name: del dhcp routes inetRouter
      ansible.builtin.shell: |
        ip route del 192.168.0.1 dev enp0s3 || true
      when: inventory_hostname == 'inetRouter'

    - name: del dhcp routes all other
      ansible.builtin.shell: |
        ip route del default via 10.0.2.2 dev enp0s3 || true
        ip route del 192.168.0.1 dev enp0s3 || true
      when: inventory_hostname != 'inetRouter'

- name: netplans servers
  hosts: servers
  gather_facts: no
  tasks:

    - name: centralServer routes
      ansible.builtin.copy:
        dest: /etc/netplan/60-routing-fix.yaml
        owner: root
        group: root
        mode: '0640'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              enp0s8:
                addresses:
                  - 192.168.0.2/28
                routes:
                  - to: default
                    via: 192.168.0.1
      when: inventory_hostname == 'centralServer'

    - name: office1Server routes
      ansible.builtin.copy:
        dest: /etc/netplan/60-routing-fix.yaml
        owner: root
        group: root
        mode: '0640'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              enp0s8:
                addresses:
                  - 192.168.2.130/26
                routes:
                  - to: default
                    via: 192.168.2.129
      when: inventory_hostname == 'office1Server'

    - name: office2Server routes
      ansible.builtin.copy:
        dest: /etc/netplan/60-routing-fix.yaml
        owner: root
        group: root
        mode: '0640'
        content: |
          network:
            version: 2
            renderer: networkd
            ethernets:
              enp0s8:
                addresses:
                  - 192.168.1.2/25
                routes:
                  - to: default
                    via: 192.168.1.1
      when: inventory_hostname == 'office2Server'

    - name: del Vagrant netplan
      ansible.builtin.file:
        path: /etc/netplan/50-vagrant.yaml
        state: absent

    - name: restart network
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted

    - name: netplan apply
      ansible.builtin.shell: |
        netplan apply || true

    - name: del dhcp routes servers
      ansible.builtin.shell: |
        ip route del default via 10.0.2.2 dev enp0s3 || true
        ip route del 192.168.0.1 dev enp0s3 || true
