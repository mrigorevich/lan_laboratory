[routers]
inetRouter    ansible_host=192.168.50.1
centralRouter ansible_host=192.168.50.2
office1Router ansible_host=192.168.50.3
office2Router ansible_host=192.168.50.4

[routers:vars]
ansible_user=root
ansible_ssh_private_key_file=/root/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[servers]
centralServer ansible_host=192.168.50.5
office1Server ansible_host=192.168.50.6
office2Server ansible_host=192.168.50.7

[servers:vars]
ansible_user=root
ansible_ssh_private_key_file=/root/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
